services:
  dispatch:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      # Container database path overrides the local .env value.
      DISPATCH_DB_PATH: /var/lib/dispatch/dispatch.db
    volumes:
      - ./data:/var/lib/dispatch
    env_file:
      - .env

volumes:
  # SQLite is an embedded database, so a persistent filesystem volume replaces
  # a separate database-server container.
  dispatch-sqlite:
